name: Repository contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.15'
      - name: Install pinned maintenance dependencies
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m pip install --require-hashes --only-binary=:all: -r tools/ci/source_organization_build_requirements.txt
          "$PYTHON" -m pip install --require-hashes --no-build-isolation --no-binary=tree-sitter \
            --only-binary=tree-sitter-cpp,tree-sitter-lua,tree-sitter-java,tree-sitter-javascript,tree-sitter-objc,tree-sitter-bash \
            -r tools/ci/source_organization_requirements.txt
          "$PYTHON" -m pip install --require-hashes -r CI/requirements-validation.txt
      - name: Check portable instruction paths
        id: markdown
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          # A rewritten push can name an obsolete base outside current ancestry.
          # Never restore that ancestry merely to run the documentation guard.
          base="$BASE_SHA"
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null || ! git merge-base --is-ancestor "$base" HEAD; then
            base=$(git rev-parse HEAD^)
          fi
          "$PYTHON" tools/check_instruction_home_paths.py --base "$base"
          "$PYTHON" tools/ci/source_organization.py check --base-ref "$base" --output "$RUNNER_TEMP/source-growth.json"
          "$PYTHON" CI/changed_markdown.py --base "$base" --github-output "$GITHUB_OUTPUT"
      - name: Test maintenance contracts with synthetic inputs
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -B -m unittest discover -s tools/tests -p test_instruction_home_paths.py
          "$PYTHON" -B -m unittest discover -s tools/tests -p test_source_organization.py
          "$PYTHON" -B -m unittest discover -s tools/tests -p test_test_inventory.py
          "$PYTHON" -B -m unittest discover -s tools/tests -p test_text_line_endings.py
          "$PYTHON" -B -m unittest discover -s tools/tests -p test_validate_json.py
          "$PYTHON" -B -m unittest discover -s tools/tests -p test_changed_markdown.py
          "$PYTHON" -B -m unittest discover -s tools/tests -p test_git_source_snapshot.py
          "$PYTHON" -B -m unittest discover -s tools/tests -p test_publication_content.py
          "$PYTHON" tools/ci/test_inventory.py
      - name: Cache pinned credential detector archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nh-gitleaks/gitleaks.tar.gz
          key: credential-gitleaks-${{ runner.os }}-${{ hashFiles('tools/ci/gitleaks.lock.json') }}
      - name: Fetch and authenticate pinned credential detector
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          ARCHIVE: ${{ runner.temp }}/nh-gitleaks/gitleaks.tar.gz
        run: |
          if [ ! -e "$ARCHIVE" ]; then
            mkdir -p "$(dirname "$ARCHIVE")"
            url=$("$PYTHON" -B tools/ci/credential_archive.py --url)
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --max-redirs 5 --connect-timeout 10 --max-time 60 --max-filesize 8230402 \
              --output "$ARCHIVE.part" "$url"
            mv "$ARCHIVE.part" "$ARCHIVE"
          fi
          "$PYTHON" -B tools/ci/credential_archive.py --verify "$ARCHIVE"
      - name: Test credential prevention with synthetic inputs only
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          NH_CREDENTIAL_TEST_ARCHIVE: ${{ runner.temp }}/nh-gitleaks/gitleaks.tar.gz
        run: |
          "$PYTHON" -B -m unittest discover -s tools/tests -p 'test_credential_*.py'
      - name: Check publication content in the exact commit
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          git --no-lazy-fetch --no-replace-objects --version
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_SHA"
          "$PYTHON" -B tools/ci/publication_content.py --root . --revision "$TARGET_SHA"
      - name: Prevent credentials in supported text of the exact commit
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          TARGET_SHA: ${{ github.sha }}
          ARCHIVE: ${{ runner.temp }}/nh-gitleaks/gitleaks.tar.gz
        run: |
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_SHA"
          "$PYTHON" -B tools/ci/credential_text_gate.py --root . --revision "$TARGET_SHA" \
            --gitleaks-archive "$ARCHIVE"
      - name: Validate tracked public source contracts
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -B CI/check_text_line_endings.py
          "$PYTHON" -B CI/validate_json.py
          "$PYTHON" -B CI/normalize_relative_includes.py --repo .
          "$PYTHON" -B tools/ci/source_export_policy.py
      - name: Validate changed Markdown
        if: steps.markdown.outputs.count != '0'
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          config: CI/example.markdownlint-cli2.jsonc
          globs: ${{ steps.markdown.outputs.files }}
      - name: Verify generated module and committed artwork
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" tools/update-new-horizons-module.py --check
          "$PYTHON" tools/nhart.py verify Mods/new-horizons/NewHorizons.nhart --manifest assets/new-horizons/runtime-art-manifest.json

  pure-state:
    # These nine state-machine checks need no original game data or display.
    # Native engine and rendered acceptance remain separate managed checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned test framework only
        run: git submodule update --init --depth 1 test/googletest
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.15'
      - name: Install public build dependencies
        run: |
          sudo apt-get -q update
          sudo apt-get -y --no-install-recommends install \
            cmake ninja-build g++ libboost-filesystem-dev libboost-date-time-dev \
            libboost-program-options-dev libboost-iostreams-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            zlib1g-dev libavformat-dev libswscale-dev libtbb-dev \
            libluajit-5.1-dev libminizip-dev libsqlite3-dev libcurl4-openssl-dev \
            libsquish-dev libfmt-dev liblzma-dev
      - name: Configure and build reviewed standalone checks
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          cmake --preset new-horizons-linux-test -DPython3_EXECUTABLE="$PYTHON"
          cmake --build --preset new-horizons-linux-test
      - name: Verify registration and run checks
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          ctest --preset new-horizons-linux-test --show-only=json-v1 > "$RUNNER_TEMP/pure-tests.json"
          "$PYTHON" tools/ci/test_inventory.py --ctest-json "$RUNNER_TEMP/pure-tests.json"
          ctest --preset new-horizons-linux-test
