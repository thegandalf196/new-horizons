name: New Horizons Windows x64 Preview

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Validate notices/sources without compiling the client (may build the patched decoder)
        type: boolean
        default: true
      repack_run_id:
        description: Optional historical upstream-decoder build run for notice-only repair
        type: string
        default: ''
  # Initially registered by a scoped push. Manual branch dispatch is now
  # verified; run the notice-first preflight before a full client rebuild.

permissions:
  contents: read
  actions: read

concurrency:
  group: new-horizons-windows-x64
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'thegandalf196/new-horizons' && github.ref == 'refs/heads/main'
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    env:
      VSLANG: '1033'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify preserved dependency recipes without upstream lookup
        run: python tools/ci/verify_vendored_dependencies.py

      - name: Install upstream MSVC v142 toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $version = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationVersion
          "MSBUILD_VS_VERSION=$(($version -split '\.')[0])" >> $env:GITHUB_ENV
          $installation = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $process = Start-Process -FilePath $installer -ArgumentList @('modify', '--installPath', "`"$installation`"", '--add', 'Microsoft.VisualStudio.Component.VC.v142.x86.x64', '--quiet', '--norestart') -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "VS installer failed: $($process.ExitCode)" }

      - name: Restore upstream Conan binary cache
        run: |
          set -euo pipefail
          python -m pip install 'conan>=2.25,<3' 'pefile==2024.8.26'
          python -c "import pefile; assert pefile.__version__ == '2024.8.26'"
          archive="$RUNNER_TEMP/dependencies-windows-x64.txz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/vcmi/vcmi-dependencies/releases/download/2026-09-01/dependencies-windows-x64.txz
          echo "6772d2e9f0a730329a195edce895a863d9115c4bba43101a9a6df3fefe6cfe43  $archive" | sha256sum --check
          conan cache restore "$archive"
          echo 'NH_VERIFIED_CONAN_CACHE_SHA256=6772d2e9f0a730329a195edce895a863d9115c4bba43101a9a6df3fefe6cfe43' >> "$GITHUB_ENV"

      - name: Seed verified Conan source cache fallback for dav1d
        env:
          DAV1D_SOURCE_SHA256: 686616b7c69eb88d44459391ab25cac13b6647a3b288835c5784e71c1514a5c5
        run: |
          set -euo pipefail
          source_cache="$RUNNER_TEMP/conan-source-cache"
          archive="$RUNNER_TEMP/dav1d-1.5.4.tar.xz"
          downloaded=
          # The Conan recipe's canonical downloads.videolan.org endpoint has
          # timed out on the hosted runner. These are public VideoLAN mirrors;
          # only bytes matching the pinned upstream SHA-256 are accepted.
          for url in \
            https://videolan.c3sl.ufpr.br/dav1d/1.5.4/dav1d-1.5.4.tar.xz \
            https://videolan.mirror.garr.it/videolan/dav1d/1.5.4/dav1d-1.5.4.tar.xz; do
            echo "Fetching dav1d source mirror: $url"
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
                --output "$archive" "$url"; then
              if python - "$archive" "$DAV1D_SOURCE_SHA256" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          path, expected = Path(sys.argv[1]), sys.argv[2]
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'dav1d mirror SHA-256 mismatch: {actual}')
          PY
              then
                downloaded=1
                break
              fi
            fi
            rm -f "$archive"
          done
          test "$downloaded" = 1
          python - "$source_cache" "$archive" "$DAV1D_SOURCE_SHA256" <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, 'tools/ci')
          from preflight_dependency_sources import seed_source_cache

          print(seed_source_cache(Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]))
          PY
          echo "NH_CONAN_SOURCE_CACHE=$source_cache" >> "$GITHUB_ENV"

      - name: Seed verified Conan source cache fallback for GNU libiconv
        env:
          # Pinned by Conan Center Index recipes/libiconv/all/conandata.yml for 1.17.
          LIBICONV_SOURCE_SHA256: 8f74213b56238c85a50a5329f77e06198771e70dd9a739779f4c02f65d971313
        run: |
          set -euo pipefail
          source_cache="$RUNNER_TEMP/conan-source-cache"
          archive="$RUNNER_TEMP/libiconv-1.17.tar.gz"
          downloaded=
          # These are GNU-listed mirrors; accept only the checksum pinned by
          # the exact Conan Center Index 1.17 recipe, never the mirror bytes' own hash.
          for url in \
            https://mirrors.ocf.berkeley.edu/gnu/libiconv/libiconv-1.17.tar.gz \
            https://mirror.csclub.uwaterloo.ca/gnu/libiconv/libiconv-1.17.tar.gz; do
            echo "Fetching libiconv source mirror: $url"
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
                --output "$archive" "$url"; then
              if python - "$archive" "$LIBICONV_SOURCE_SHA256" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          path, expected = Path(sys.argv[1]), sys.argv[2]
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'libiconv mirror SHA-256 mismatch: {actual}')
          PY
              then
                downloaded=1
                break
              fi
            fi
            rm -f "$archive"
          done
          test "$downloaded" = 1
          python - "$source_cache" "$archive" "$LIBICONV_SOURCE_SHA256" <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, 'tools/ci')
          from preflight_dependency_sources import seed_source_cache

          print(seed_source_cache(Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]))
          PY
          echo "NH_CONAN_SOURCE_CACHE=$source_cache" >> "$GITHUB_ENV"

      - name: Seed verified Conan source cache fallback for SDL3_image
        env:
          # Exact official release bytes pinned by the unchanged SDL_image recipe.
          SDL_IMAGE_SOURCE_SHA256: 29751304a13d25ac513f24305fa25b06a6edd9607718c90129b8350d35fc5573
          SDL_IMAGE_SOURCE_BYTES: 11123077
        run: |
          set -euo pipefail
          source_cache="$RUNNER_TEMP/conan-source-cache"
          archive="$RUNNER_TEMP/SDL3_image-3.4.4.tar.gz"
          # Independent official endpoint; one bounded fetch, no retry loop.
          # Never substitute a new checksum or alter the canonical recipe URL.
          curl --fail --location --max-redirs 3 --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 120 --max-filesize 15728640 --retry 0 \
            --output "$archive" https://www.libsdl.org/projects/SDL_image/release/SDL3_image-3.4.4.tar.gz
          python - "$source_cache" "$archive" "$SDL_IMAGE_SOURCE_SHA256" "$SDL_IMAGE_SOURCE_BYTES" <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, 'tools/ci')
          from preflight_dependency_sources import seed_source_cache

          archive = Path(sys.argv[2])
          if archive.stat().st_size != int(sys.argv[4]):
              raise SystemExit('SDL3_image official source size mismatch')
          print(seed_source_cache(Path(sys.argv[1]), archive, sys.argv[3]))
          PY
          echo "NH_CONAN_SOURCE_CACHE=$source_cache" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1, upstream; no private-repository subscription gate
        with:
          arch: x64
          toolset: '14.29'

      - name: Cache compiler outputs for packaging retries
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1, upstream
        with:
          variant: sccache
          key: new-horizons-msvc-x64-v142
          create-symlink: false
          max-size: 5G

      - name: Package audit regression tests (no PE execution)
        run: |
          python tools/tests/run_windows_package_regressions.py --report build/new-horizons-windows-x64/PACKAGE-REGRESSIONS.json

      - name: Preflight Microsoft notices before compiling
        shell: python
        run: |
          import os, pathlib, runpy, tempfile
          module = runpy.run_path('tools/ci/package_new_horizons_windows.py')
          with tempfile.TemporaryDirectory() as temporary:
              stage = pathlib.Path(temporary)
              try:
                  module['collect_microsoft_notices'](stage)
              except RuntimeError:
                  # Diagnostic filenames only; never upload proprietary tools or
                  # substitute a DLL copied from the runner for a redistributable.
                  for variable in ('VSINSTALLDIR', 'WindowsSdkDir'):
                      root = pathlib.Path(os.environ[variable])
                      for path in root.rglob('*'):
                          if path.is_file() and path.suffix.lower() in {'.txt', '.rtf', '.html', '.htm'} and any(term in path.name.lower() for term in ('license', 'eula', 'redist')):
                              print(variable + '/' + path.relative_to(root).as_posix())
                  raise
              for path in sorted(stage.rglob('*')):
                  if path.is_file():
                      print(path.relative_to(stage).as_posix())

      - name: Resolve upstream dependency profile
        env:
          ORIGINAL_REPACK_RUN_ID: ${{ inputs.repack_run_id }}
        run: |
          set -euo pipefail
          conan profile detect
          install_recipe=.
          build_policy=(--build='sdl_image/3.4.4@newhorizons/patched' --conf='tools.build:jobs=4')
          if [[ -n "$ORIGINAL_REPACK_RUN_ID" ]]; then
            # An old binary must retain its original dependency source graph.
            install_recipe=tools/ci/conan_notice_repack.py
            build_policy=(--build=never)
          else
            conan export tools/conan/sdl_image --version=3.4.4 --user=newhorizons --channel=patched
          fi
          conan install "$install_recipe" --output-folder=conan-generated "${build_policy[@]}" \
            --core-conf="core.sources:download_cache=$NH_CONAN_SOURCE_CACHE" \
            --profile=dependencies/conan_profiles/msvc-x64 \
            --conf='tools.cmake.cmaketoolchain:generator=Ninja' \
            --conf="tools.microsoft.msbuild:vs_version=${MSBUILD_VS_VERSION}" \
            -s '&:build_type=RelWithDebInfo' -o '&:target_pre_windows10=True' \
            -o '&:with_onnxruntime=False' -o '&:with_discord_presence=False' \
            --format=json > conan-generated-graph.json

      - name: Windows PowerShell 5.1 launcher setup smoke (no game or GUI)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -File tools/windows/tests/Setup-Smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "Setup smoke failed: $LASTEXITCODE" }
          powershell.exe -NoProfile -File tools/windows/tests/Managed-Preset-Smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "Managed preset smoke failed: $LASTEXITCODE" }

      - name: Preflight complete dependency graph and source archives
        shell: python
        env:
          ORIGINAL_REPACK_RUN_ID: ${{ inputs.repack_run_id }}
        run: |
          import os, pathlib, runpy, sys
          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / 'tools/ci'))
          from preflight_dependency_sources import preflight
          module = runpy.run_path('tools/ci/package_new_horizons_windows.py')
          stage = root / 'build/new-horizons-windows-x64/preflight'
          stage.mkdir(parents=True)
          if os.environ['ORIGINAL_REPACK_RUN_ID']:
              # Preserve the historical notice-repack input format.
              module['collect_notices'](root / 'conan-generated-graph.json', stage / 'notices',
                                        stage / 'dependency-sources.tar.gz',
                                        source_cache=pathlib.Path(os.environ['NH_CONAN_SOURCE_CACHE']))
          else:
              report = preflight(root / 'conan-generated-graph.json', stage / 'graph-check',
                                 root / 'CMakePresets.json',
                                 pathlib.Path(os.environ['NH_CONAN_SOURCE_CACHE']))
              if not report['pass']:
                  raise RuntimeError('Full dependency preflight failed; see retained PREFLIGHT-REPORT.json. No client compile permitted.')
          exclusions = module['source_archive'](root, stage / 'fork-source.tar.gz', os.environ['GITHUB_SHA'])
          print('All dependency notices, dependency sources and fork source archived; exclusions:', exclusions)

      - name: Retain structured regression and preflight reports, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-preflight-reports-${{ github.sha }}
          path: |
            build/new-horizons-windows-x64/PACKAGE-REGRESSIONS.json
            build/new-horizons-windows-x64/preflight/**/PREFLIGHT-REPORT.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload source-only preflight evidence (not a playable package)
        if: inputs.preflight_only
        uses: actions/upload-artifact@v4
        with:
          name: Dependency-source-preflight-${{ github.sha }}
          path: build/new-horizons-windows-x64/preflight
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Configure client and internal authority
        if: ${{ !inputs.preflight_only && inputs.repack_run_id == '' }}
        run: >-
          cmake --preset new-horizons-windows-x64
          -DENABLE_CCACHE=ON
          -DENABLE_NH_SDL3_MASK_REGRESSION=ON
          -DENABLE_NH_ART_CACHE_REGRESSION=ON
          -DENABLE_NH_PREVIEW_SURFACE_REGRESSION=ON
          -DENABLE_NH_SDL3_OUTLINE_REGRESSION=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Verify CMake-selected CRT bytes before compiling
        if: ${{ !inputs.preflight_only && inputs.repack_run_id == '' }}
        shell: python
        run: |
          import json, os, pathlib, sys
          sys.path.insert(0, 'tools/ci')
          from windows_crt_provenance import preflight_runtime
          root = pathlib.Path('build/new-horizons-windows-x64')
          output = root / 'preflight' / 'selected-crt-runtime.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          try:
              report = preflight_runtime(root, pathlib.Path(os.environ['VSINSTALLDIR']))
              report['pass'] = True
          except Exception as error:
              output.write_text(json.dumps({'pass': False, 'error_type': type(error).__name__}) + '\n', encoding='utf-8')
              raise
          output.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')

      - name: Retain selected CRT precompile evidence
        if: ${{ always() && !inputs.preflight_only && inputs.repack_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Selected-CRT-precompile-${{ github.sha }}
          path: build/new-horizons-windows-x64/preflight/selected-crt-runtime.json
          if-no-files-found: warn
          retention-days: 7

      - name: Compile Windows x64 client
        if: ${{ !inputs.preflight_only && inputs.repack_run_id == '' }}
        run: cmake --build build/new-horizons-windows-x64 --target vcmiclient nhSdl3GrayscaleMaskRuntimeTest nhArtStartupRuntimeTest nhImageOptimizerRuntimeTest nhCreaturePreviewSurfaceRuntimeTest nhSdl3OutlineRuntimeTest --parallel 4 -- -d keeprsp

      - name: Record bounded Windows AI compiler flag evidence
        if: ${{ !inputs.preflight_only && inputs.repack_run_id == '' }}
        shell: bash
        run: |
          python -m unittest discover -s tools/ci -p test_windows_ai_compile_flags.py
          python tools/ci/windows_ai_compile_flags.py --build-root build/new-horizons-windows-x64 --output build/new-horizons-windows-x64/preflight/windows-ai-compile-flags.json

      - name: Retain only Windows AI compiler flag evidence
        if: ${{ always() && !inputs.preflight_only && inputs.repack_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Windows-AI-compile-flags-${{ github.sha }}
          path: build/new-horizons-windows-x64/preflight/windows-ai-compile-flags.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage upstream runtime and resources
        if: ${{ !inputs.preflight_only && inputs.repack_run_id == '' }}
        run: cmake --install build/new-horizons-windows-x64

      - name: Verify crop and preview surface equivalence with shipping SDL3 (CPU only)
        if: ${{ !inputs.preflight_only && inputs.repack_run_id == '' }}
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, tempfile

          root = pathlib.Path('build/new-horizons-windows-x64').resolve()
          names = ('nhImageOptimizerRuntimeTest', 'nhCreaturePreviewSurfaceRuntimeTest', 'nhSdl3OutlineRuntimeTest')
          destinations = [root / 'install' / (name + '.exe') for name in names]
          for destination in destinations:
              if destination.exists() or destination.is_symlink():
                  raise RuntimeError('Refusing to overwrite an existing surface-test executable')
          task = pathlib.Path(tempfile.mkdtemp(prefix='surface-regression-', dir=root))
          profile = task / 'profile'
          profile.mkdir(mode=0o700)
          env = os.environ.copy()
          env['HOME'] = str(profile)
          for key, leaf in (
              ('XDG_CONFIG_HOME', 'config'), ('XDG_DATA_HOME', 'data'),
              ('XDG_CACHE_HOME', 'cache'), ('XDG_STATE_HOME', 'state'),
              ('XDG_RUNTIME_DIR', 'runtime'),
          ):
              directory = profile / leaf
              directory.mkdir(mode=0o700)
              env[key] = str(directory)
          for key in ('DISPLAY', 'WAYLAND_DISPLAY', 'PULSE_SERVER', 'PIPEWIRE_REMOTE', 'PIPEWIRE_RUNTIME_DIR'):
              env.pop(key, None)
          for key in ('SDL_VIDEODRIVER', 'SDL_VIDEO_DRIVER', 'SDL_AUDIODRIVER', 'SDL_AUDIO_DRIVER'):
              env[key] = 'dummy'
          # Retain Windows SYSTEMROOT/PATH for the native loader. The test EXEs
          # reside beside the installed shipping facade and SDL3 providers.
          created = []
          try:
              for name, destination in zip(names, destinations):
                  with (root / 'bin' / (name + '.exe')).open('rb') as source:
                      with destination.open('xb') as target:
                          created.append(destination)
                          shutil.copyfileobj(source, target)
                  with (task / (name + '.stdout.log')).open('wb') as stdout:
                      with (task / (name + '.stderr.log')).open('wb') as stderr:
                          result = subprocess.run(
                              [str(destination)], cwd=task, env=env,
                              stdout=stdout, stderr=stderr, timeout=30, check=False,
                          )
                  print((task / (name + '.stdout.log')).read_text(encoding='utf-8', errors='replace'))
                  print((task / (name + '.stderr.log')).read_text(encoding='utf-8', errors='replace'))
                  result.check_returncode()
          finally:
              for destination in created:
                  destination.unlink()

      - name: Retain crop and preview surface regression logs, including failures
        if: ${{ always() && !inputs.preflight_only && inputs.repack_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Surface-regression-${{ github.sha }}
          path: |
            build/new-horizons-windows-x64/surface-regression-*/*.stdout.log
            build/new-horizons-windows-x64/surface-regression-*/*.stderr.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify selected masks and palette updates with shipping SDL3 (CPU only)
        if: ${{ !inputs.preflight_only && inputs.repack_run_id == '' }}
        run: |
          set -euo pipefail
          python tools/ci/prepare_sdl3_mask_regression.py \
            --pack build/new-horizons-windows-x64/install/Mods/new-horizons/NewHorizons.nhart \
            --manifest assets/new-horizons/runtime-art-manifest.json \
            --output build/new-horizons-windows-x64/sdl3-mask-fixtures
          test_exe=build/new-horizons-windows-x64/install/nhSdl3GrayscaleMaskRuntimeTest.exe
          cp build/new-horizons-windows-x64/bin/nhSdl3GrayscaleMaskRuntimeTest.exe "$test_exe"
          trap 'rm -f "$test_exe"' EXIT
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_VIDEO_DRIVER=dummy SDL_AUDIO_DRIVER=dummy
          unset DISPLAY WAYLAND_DISPLAY
          "$test_exe" build/new-horizons-windows-x64/sdl3-mask-fixtures --interlace-regression \
            > build/new-horizons-windows-x64/sdl3-mask.stdout.log \
            2> build/new-horizons-windows-x64/sdl3-mask.stderr.log
          python - <<'PY'
          from pathlib import Path
          output = Path('build/new-horizons-windows-x64/sdl3-mask.stdout.log').read_text()
          errors = Path('build/new-horizons-windows-x64/sdl3-mask.stderr.log').read_text()
          required = ('RGBA noninterlaced', 'RGBA Adam7', 'indexed noninterlaced', 'indexed Adam7')
          if any('PASS: ' + label + ' all 81 exact RGBA pixels' not in output for label in required):
              raise RuntimeError('Interlace pixel/alpha controls did not all pass')
          if 'Interlace handling should be turned on when using png_read_image' in errors:
              raise RuntimeError('Shipping SDL3_image still emits the interlace warning')
          print(output)
          if errors:
              print(errors)
          PY

      - name: Retain decoder pixel and warning evidence
        if: ${{ always() && !inputs.preflight_only && inputs.repack_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Decoder-regression-${{ github.sha }}
          path: build/new-horizons-windows-x64/sdl3-mask.*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify native NHART preparation and matched-byte reads (CPU only)
        if: ${{ !inputs.preflight_only && inputs.repack_run_id == '' }}
        run: |
          set -euo pipefail
          test_exe=build/new-horizons-windows-x64/install/nhArtStartupRuntimeTest.exe
          cp build/new-horizons-windows-x64/bin/nhArtStartupRuntimeTest.exe "$test_exe"
          trap 'rm -f "$test_exe"' EXIT
          mkdir -p build/new-horizons-windows-x64/nhart-regression-cache
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_VIDEO_DRIVER=dummy SDL_AUDIO_DRIVER=dummy
          unset DISPLAY WAYLAND_DISPLAY
          pin_args_file=build/new-horizons-windows-x64/nhart-native-pin-args.bin
          python tools/ci/prepare_nhart_native_pin.py --repo . \
            --pack build/new-horizons-windows-x64/install/Mods/new-horizons/NewHorizons.nhart > "$pin_args_file"
          mapfile -d '' -t pin_args < "$pin_args_file"
          "$test_exe" --pack build/new-horizons-windows-x64/install/Mods/new-horizons/NewHorizons.nhart \
            --cache-root build/new-horizons-windows-x64/nhart-regression-cache "${pin_args[@]}"

      - name: Package client, recursive PE closure, licenses and corresponding sources
        if: ${{ !inputs.preflight_only && inputs.repack_run_id == '' }}
        run: |
          set -euo pipefail
          python tools/ci/package_new_horizons_windows.py \
            --install-dir build/new-horizons-windows-x64/install \
            --conan-graph conan-generated-graph.json \
            --source-cache "$NH_CONAN_SOURCE_CACHE" \
            --output-dir build/new-horizons-windows-x64/artifact

      - name: Download original compiled artifact for notice-only repair
        if: ${{ !inputs.preflight_only && inputs.repack_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repack_run_id }}
          pattern: New-Horizons-Windows-x64-*
          path: build/new-horizons-windows-x64/original-artifact

      - name: Repair notices and sources without changing compiled payload
        if: ${{ !inputs.preflight_only && inputs.repack_run_id != '' }}
        env:
          ORIGINAL_RUN_ID: ${{ inputs.repack_run_id }}
        run: |
          python tools/ci/repack_new_horizons_windows.py \
            --original-dir build/new-horizons-windows-x64/original-artifact \
            --original-run-id "$ORIGINAL_RUN_ID" \
            --preflight-dir build/new-horizons-windows-x64/preflight \
            --output-dir build/new-horizons-windows-x64/artifact

      - name: Upload downloadable Windows preview
        if: ${{ !inputs.preflight_only }}
        uses: actions/upload-artifact@v4
        with:
          name: New-Horizons-Windows-x64-${{ github.sha }}
          path: build/new-horizons-windows-x64/artifact/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Summarize artifact scope
        if: ${{ !inputs.preflight_only }}
        shell: pwsh
        run: |
          @'
          ## New Horizons Windows x64 preview
          Download the artifact above; extract the Windows ZIP and follow README-New-Horizons.txt.
          An original Heroes III Complete installation is required; unchanged original archives are not bundled.
          NewHorizons.nhart includes selected New Horizons modifications and composites, with provenance notices.
          Includes exact identity, SHA256 checksums, source archives and dependency license texts.
          Compile/package/import validation is NOT Windows graphical or gameplay acceptance.
          Unsigned preview. GitHub Release publication remains a separate integrator action.
          '@ >> $env:GITHUB_STEP_SUMMARY
