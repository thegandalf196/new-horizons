name: New Horizons Windows notice preflight

on:
  workflow_dispatch:
  push:
    branches: [definitive-mvp]
    paths: [.github/workflows/new-horizons-windows-notices.yml]

permissions:
  contents: read

jobs:
  notices:
    if: github.repository == 'thegandalf196/vcmi' && github.ref == 'refs/heads/definitive-mvp'
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: step-security/msvc-dev-cmd@main
        with:
          arch: x64
      - name: Validate full matching Microsoft terms (no compile or game execution)
        shell: python
        run: |
          import os, pathlib, runpy
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nh-notice-preflight'
          module = runpy.run_path('tools/ci/package_new_horizons_windows.py')
          module['collect_microsoft_notices'](output)
          for path in sorted(output.rglob('*')):
              if path.is_file():
                  print(path.relative_to(output).as_posix())
      - uses: actions/upload-artifact@v4
        with:
          name: Microsoft-notice-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/nh-notice-preflight
          if-no-files-found: error
          retention-days: 7
